plugins { id 'com.android.application' }

def relay = new Properties()
def relayFile = rootProject.file('relay.properties')
if (relayFile.exists()) relayFile.withInputStream { relay.load(it) }
def buildString = { String key -> '"' + (relay.getProperty(key, '')).replace('\\', '\\\\').replace('"', '\\"') + '"' }

android {
    namespace 'com.ridenav.balance.bridge'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ridenav.balance.bridge'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '1.1.1'
        buildConfigField 'String', 'RELAY_URL', buildString('relayUrl')
        buildConfigField 'String', 'RELAY_TOKEN', buildString('relayToken')
        buildConfigField 'String', 'RELAY_SESSION', buildString('relaySession')
    }
    buildFeatures { buildConfig true }
}
